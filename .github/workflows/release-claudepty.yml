name: Release Claude PTY (rebase + build)

# Self-contained desktop release for the feat/claude-pty branch (katex + the
# experimental Claude PTY provider). This file lives ONLY on feat/claude-pty (it
# is part of the claudePty patch commit), so the clean feat/chat-math-katex
# default branch never carries any claudePty automation.
#
# Why it is not a daily auto-build like katex: GitHub only runs scheduled (cron)
# workflows from the DEFAULT branch, and we deliberately keep this off
# feat/chat-math-katex. So there is no cron. Trigger it instead from the Actions
# tab ("Run workflow"), which replays the claudePty patch onto the latest katex
# base and builds; or it builds whatever you push to feat/claude-pty.
#
# It publishes v<app_ver>-katex-claudepty.<run> as a NON-latest GitHub Release
# (the katex build from release-fork.yml stays the "latest" release). There is no
# separate updater channel: these artifacts are for manual download.
#
# The claudePty patch is large and lands on a moving upstream, so the rebase will
# sometimes conflict. When it does, the sync job opens an issue and stops; resolve
# it by hand (instructions are in the issue) and push feat/claude-pty to build.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/claude-pty

permissions:
  contents: write
  issues: write

concurrency:
  group: release-claudepty
  cancel-in-progress: false

jobs:
  sync:
    name: Rebase onto latest katex
    # Only on manual dispatch: replay the claudePty patch onto the newest katex
    # base and force-push. On push events we build exactly what was pushed.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      ref: ${{ steps.rebase.outputs.ref }}
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "fork-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --prune

      - name: Decide whether to rebase
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          katex="$(git rev-parse origin/feat/chat-math-katex)"
          # feat/claude-pty is kept as exactly one commit on top of the katex base,
          # so its parent is the katex base it currently sits on.
          ptyparent="$(git rev-parse 'origin/feat/claude-pty^')"
          title="Manual claude-pty rebase needed"
          if [ "$katex" = "$ptyparent" ]; then
            echo "claude-pty already sits on the latest katex base; nothing to rebase."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$(gh issue list --state open --limit 100 --json title \
                    -q "[.[] | select(.title==\"$title\")] | length")" != "0" ]; then
            echo "An open claude-pty rebase conflict issue exists; resolve it first."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase claudePty patch onto latest katex
        id: rebase
        if: steps.guard.outputs.skip == 'false'
        env:
          GIT_EDITOR: "true"
          GIT_SEQUENCE_EDITOR: "true"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # The single claudePty commit is the current tip of feat/claude-pty.
          # Replay just that one commit onto the latest katex base.
          pty="$(git rev-parse origin/feat/claude-pty)"
          git checkout -B feat/claude-pty origin/feat/chat-math-katex
          git cherry-pick "$pty"
          rc=$?

          # The claudePty patch does not change dependencies, so a lockfile
          # conflict is unlikely; if it is the ONLY conflict, take the katex base's
          # copy and regenerate below. Any other conflict is the real (~30%) case:
          # open an issue and stop so it can be resolved by hand.
          while [ $rc -ne 0 ]; do
            conflicted="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicted" = "pnpm-lock.yaml" ]; then
              git checkout --ours -- pnpm-lock.yaml
              git add -- pnpm-lock.yaml
              git cherry-pick --continue
              rc=$?
            else
              body="$(printf 'Replaying the Claude PTY patch onto the latest \x60feat/chat-math-katex\x60 hit conflicts the bot could not resolve:\n\n\x60\x60\x60\n%s\n\x60\x60\x60\n\nResolve it locally, then push to build:\n\n\x60\x60\x60bash\ngit fetch origin\ngit checkout -B feat/claude-pty origin/feat/chat-math-katex\ngit cherry-pick %s   # fix the conflicts, then: git cherry-pick --continue\ngit push --force-with-lease origin feat/claude-pty\n\x60\x60\x60\n\nThe push fires this workflow and builds the release. Close this issue once it lands.' "$conflicted" "$pty")"
              gh issue create --title "Manual claude-pty rebase needed" --body "$body" || true
              git cherry-pick --abort || true
              echo "::error::claude-pty rebase conflict; opened an issue."
              exit 1
            fi
          done

          set -e
          # Re-derive the lockfile from the rebased tree, then fold it into the tip
          # so a frozen install passes. Amending keeps claude-pty exactly one commit.
          vp install --lockfile-only
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git add -- pnpm-lock.yaml
            git commit --amend --no-edit
          fi

          # Push with the built-in token so this push does NOT re-trigger the
          # workflow (the build runs in this same dispatch run).
          git push --force-with-lease origin feat/claude-pty
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  preflight:
    name: Preflight
    needs: [sync]
    # Run after a clean/skipped sync, but not when sync hit a conflict (failed).
    if: always() && needs.sync.result != 'failure' && needs.sync.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ needs.sync.outputs.ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - id: meta
        name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          # Derive the release from the upstream app version with our suffix. Each
          # run gets a fresh run-number suffix, so re-runs (e.g. after fixing a
          # rebase conflict) always produce a new, valid release.
          app_ver="$(node -p "require('./apps/desktop/package.json').version")"
          version="${app_ver}-katex-claudepty.${GITHUB_RUN_NUMBER}"
          tag="v${version}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${version} tag=${tag}"

      # Quality gates required by AGENTS.md.
      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    # The optional `sync` job is skipped on push events; that skip propagates to
    # this job under the default success() check even though preflight ran. The
    # if must contain a status-check function (here !cancelled()) to override the
    # propagation, then we gate on preflight actually having succeeded.
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      # Auto-updater target: built-in GITHUB_REPOSITORY already points at this
      # fork, but set it explicitly so the embedded app-update.yml is unambiguous.
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      # Optional cloud config (leave unset to ship a local-only build).
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ secrets.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ secrets.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ secrets.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ secrets.T3CODE_RELAY_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            target: AppImage
            arch: x64
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y imagemagick
          fi

      - name: Build desktop artifact
        shell: bash
        env:
          # Apple signing/notarization (optional)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows Azure Trusted Signing (optional)
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )

          has_all() {
            for value in "$@"; do
              [[ -z "$value" ]] && return 1
            done
            return 0
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"
              echo "macOS signing enabled."
              args+=(--signed)
            else
              echo "macOS signing disabled (unsigned build)."
            fi
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            if has_all \
              "$AZURE_TENANT_ID" "$AZURE_CLIENT_ID" "$AZURE_CLIENT_SECRET" \
              "$AZURE_TRUSTED_SIGNING_ENDPOINT" "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
              "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              args+=(--signed)
            else
              echo "Windows signing disabled (unsigned build)."
            fi
          else
            echo "Signing disabled for ${{ matrix.platform }}."
          fi

          vp run dist:desktop:artifact "${args[@]}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" "release/*.zip" "release/*.AppImage" \
            "release/*.exe" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do cp "$file" release-publish/; done
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: claudepty-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, build]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: claudepty-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: T3 Code (Claude PTY) v${{ needs.preflight.outputs.version }}
          generate_release_notes: true
          # The katex build stays the "latest" release; this experimental variant
          # is published for manual download only.
          make_latest: false
          prerelease: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
