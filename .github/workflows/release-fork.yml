name: Release (fork)

# Self-contained desktop release workflow for the hongjiaherng/t3code fork.
#
# It builds the desktop app for macOS / Linux / Windows and publishes a GitHub
# Release on THIS repo. The desktop auto-updater is repo-relative
# (resolveGitHubPublishConfig in scripts/build-desktop-artifact.ts reads
# GITHUB_REPOSITORY / T3CODE_DESKTOP_UPDATE_REPOSITORY), so builds produced here
# update from this fork's releases automatically.
#
# Differences from upstream .github/workflows/release.yml. All the T3-only
# infrastructure is removed:
#   - no nightly schedule, no Discord announce, no npm CLI publish, no Vercel deploy
#   - no `production` GitHub Environment (Clerk/relay config is OPTIONAL; see below)
#   - publishes with the built-in GITHUB_TOKEN instead of a GitHub App token
#   - runs on GitHub-hosted runners instead of the blacksmith runner fleet
#
# Cloud features (T3 Connect login / sync / mobile linking) are gated on
# hasCloudPublicConfig (apps/server/src/cloud/publicConfig.ts). If you leave the
# T3CODE_* secrets unset, the build still works; cloud is simply disabled and the
# app runs as a local coding agent (which is all that math rendering needs). To
# enable cloud features, set the T3CODE_* repo secrets to T3's public client values.
#
# Signing is optional and auto-detected from secrets, same as upstream. With no
# signing secrets you get unsigned builds (Gatekeeper/SmartScreen will warn).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3 or v1.2.3)"
        required: true
        type: string
  push:
    # The sync bot fast-forwards this branch onto each upstream release; that
    # push builds + publishes the matching release.
    branches:
      - feat/chat-math-katex
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      skip: ${{ steps.meta.outputs.skip }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - id: meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${DISPATCH_VERSION#v}"
            tag="v${version}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="${GITHUB_REF_NAME}"
          else
            # Push to the default branch (the sync bot fast-forwarded it onto a
            # new upstream release): derive the release version from that
            # upstream app version.
            app_ver="$(node -p "require('./apps/desktop/package.json').version")"
            existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              -q "[.[].tag_name] | map(select(startswith(\"v${app_ver}-katex.\"))) | length" 2>/dev/null || echo 0)"
            if [[ "${existing}" != "0" ]]; then
              echo "v${app_ver}-katex.* already released; skipping build."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="${app_ver}-katex.${GITHUB_RUN_NUMBER}"
            tag="v${version}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${version} tag=${tag}"

      # Quality gates required by AGENTS.md.
      - name: Check
        if: steps.meta.outputs.skip != 'true'
        run: vp check

      - name: Typecheck
        if: steps.meta.outputs.skip != 'true'
        run: vp run typecheck

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      # Auto-updater target: built-in GITHUB_REPOSITORY already points at this
      # fork, but set it explicitly so the embedded app-update.yml is unambiguous.
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      # Optional cloud config (leave unset to ship a local-only build).
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ secrets.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ secrets.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ secrets.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ secrets.T3CODE_RELAY_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            target: AppImage
            arch: x64
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y imagemagick
          fi

      - name: Build desktop artifact
        shell: bash
        env:
          # Apple signing/notarization (optional)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows Azure Trusted Signing (optional)
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )

          has_all() {
            for value in "$@"; do
              [[ -z "$value" ]] && return 1
            done
            return 0
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"
              echo "macOS signing enabled."
              args+=(--signed)
            else
              echo "macOS signing disabled (unsigned build)."
            fi
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            if has_all \
              "$AZURE_TENANT_ID" "$AZURE_CLIENT_ID" "$AZURE_CLIENT_SECRET" \
              "$AZURE_TRUSTED_SIGNING_ENDPOINT" "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
              "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              args+=(--signed)
            else
              echo "Windows signing disabled (unsigned build)."
            fi
          else
            echo "Signing disabled for ${{ matrix.platform }}."
          fi

          vp run dist:desktop:artifact "${args[@]}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" "release/*.zip" "release/*.AppImage" \
            "release/*.exe" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do cp "$file" release-publish/; done
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: T3 Code (fork) v${{ needs.preflight.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
